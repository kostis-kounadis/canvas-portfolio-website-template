<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Portfolio — Setup</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header id="header">
    <div id="header-brand">
      <div class="logo-dot"></div>
      <h1>Canvas Portfolio <span>Setup</span></h1>
    </div>
    <div id="header-actions">
      <div class="unsaved-dot" id="unsaved-dot" title="Unsaved changes"></div>
      <button class="btn btn-secondary btn-sm" id="btn-reload-preview" title="Reload preview iframe">↺ Reload Preview</button>
      <button class="btn btn-secondary btn-sm" id="btn-rebuild" title="Run generate-data.js to update SEO tags, sitemap & webmanifest">⚙ Rebuild Site</button>
      <button class="btn btn-primary" id="btn-save">💾 Save Config</button>
    </div>
  </header>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <nav id="sidebar-tabs" role="tablist" aria-label="Setup sections">
      <button class="tab-btn active" data-tab="identity"     role="tab"><span class="tab-icon">👤</span> Identity</button>
      <button class="tab-btn"        data-tab="modules"      role="tab"><span class="tab-icon">⊞</span> Modules</button>
      <button class="tab-btn"        data-tab="theme"        role="tab"><span class="tab-icon">🎨</span> Theme</button>
      <button class="tab-btn"        data-tab="typography"   role="tab"><span class="tab-icon">Aa</span> Typography</button>
      <button class="tab-btn"        data-tab="layouts"      role="tab"><span class="tab-icon">⊟</span> Layouts</button>
      <button class="tab-btn"        data-tab="categories"   role="tab"><span class="tab-icon">⊛</span> Categories</button>
      <button class="tab-btn"        data-tab="imageeffects" role="tab"><span class="tab-icon">✦</span> Image Effects</button>
      <button class="tab-btn"        data-tab="imageclick"   role="tab"><span class="tab-icon">↗</span> Image Click</button>
      <button class="tab-btn"        data-tab="info"         role="tab"><span class="tab-icon">ℹ</span> INFO Panel</button>
      <button class="tab-btn"        data-tab="seo"          role="tab"><span class="tab-icon">🔍</span> SEO</button>
      <button class="tab-btn"        data-tab="favicon"      role="tab"><span class="tab-icon">🖼</span> Favicon</button>
      <button class="tab-btn"        data-tab="help"         role="tab"><span class="tab-icon">❓</span> Help</button>
    </nav>
    <div id="sidebar-footer">
      <button class="btn btn-primary btn-full" id="btn-save-footer">💾 Save Config</button>
    </div>
  </aside>

  <!-- ── Preview + Panel overlay ─────────────────────────────────────────── -->
  <div id="preview-area">
    <div id="preview-toolbar">
      <label>Preview</label>
      <div id="preview-url">http://localhost:3000/</div>
      <button class="btn btn-ghost btn-sm" id="btn-open-preview" title="Open in new tab">↗ Open</button>
    </div>
    <iframe id="preview-iframe" src="/" title="Portfolio live preview" allow="same-origin"></iframe>
  </div>

  <!-- ── Status bar ──────────────────────────────────────────────────────── -->
  <footer id="status-bar">
    <div id="status-message">Ready.</div>
    <div id="status-version">Canvas Portfolio Template v1</div>
  </footer>

</div><!-- /#app -->

<!-- ── Tab panels (rendered by JS, injected into a floating layer) ─────────── -->
<!-- Identity -->
<template id="tpl-identity">
  <div class="section-card">
    <div class="section-header"><h3>🌐 Site Identity</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="id-title">Site Title</label>
        <input type="text" id="id-title" data-path="site.title" placeholder="My Portfolio" />
        <span class="hint">Shown in browser tab and as the title module on canvas.</span>
      </div>
      <div class="field">
        <label for="id-email">Email Address</label>
        <input type="email" id="id-email" data-path="site.email" placeholder="hello@example.com" />
      </div>
      <div class="field">
        <label for="id-url">Site URL</label>
        <input type="url" id="id-url" data-path="site.url" placeholder="https://example.com" />
        <span class="hint">Used for SEO canonical URL and Schema.org markup.</span>
      </div>
      <div class="field">
        <label for="id-author">Author Name</label>
        <input type="text" id="id-author" data-path="site.author" placeholder="Your Name" />
      </div>
      <div class="field">
        <label for="id-info-text">INFO / About Text</label>
        <textarea id="id-info-text" data-path="site.infoText" rows="5" placeholder="Describe yourself and your work…"></textarea>
        <span class="hint">Supports **bold**, _italic_, and [links](url). Shown in the INFO overlay.</span>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About this section</summary>
    <div class="help-content">
      <p>This is the first thing to fill in. Your <strong>Site Title</strong> appears in the browser tab, the canvas title module, and is automatically synced to the favicon webmanifest after a rebuild.</p>
      <p>The <strong>INFO Text</strong> supports basic Markdown for bold, italic, and links. It's displayed in the overlay that opens when visitors click your INFO button.</p>
    </div>
  </details>
</template>

<!-- Modules -->
<template id="tpl-modules">
  <div class="section-card">
    <div class="section-header"><h3>⊞ Module Positions</h3></div>
    <div class="section-body">
      <div id="zone-diagram-wrap">
        <div class="zone-diagram" id="zone-diagram">
          <div class="zone-cell" data-zone="top-left">top-left</div>
          <div class="zone-cell" data-zone="top-center">top-center</div>
          <div class="zone-cell" data-zone="top-right">top-right</div>
          <div class="zone-cell" data-zone="middle-left">mid-left</div>
          <div class="zone-cell" data-zone="middle-center">mid-center</div>
          <div class="zone-cell" data-zone="middle-right">mid-right</div>
          <div class="zone-cell" data-zone="bottom-left">btm-left</div>
          <div class="zone-cell" data-zone="bottom-center">btm-center</div>
          <div class="zone-cell" data-zone="bottom-right">btm-right</div>
        </div>
      </div>
      <div id="modules-list"></div>
      <div class="toggle-row">
        <label>Zoom Controls Visible</label>
        <label class="toggle"><input type="checkbox" id="mod-zoom-visible" data-path="ui.zoom.visible" /><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About module zones</summary>
    <div class="help-content">
      <p>Each module (Title, Email, INFO, Categories, Layouts) can be independently positioned in any of the 9 zones on the canvas overlay. The diagram above shows which zones are currently occupied.</p>
      <p>On mobile, modules are always shown in a fixed navigation bar — zone positions only apply on desktop.</p>
    </div>
  </details>
</template>

<!-- Theme -->
<template id="tpl-theme">
  <div class="section-card">
    <div class="section-header"><h3>🎨 Colours</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Background Colour</label>
        <div class="color-row">
          <input type="color" id="th-bg-color" data-path="theme.backgroundColor" />
          <input type="text" class="color-hex" id="th-bg-color-hex" placeholder="#f7f5f0" />
        </div>
      </div>
      <div class="field">
        <label>Text Colour</label>
        <div class="color-row">
          <input type="color" id="th-text-color" data-path="theme.textColor" />
          <input type="text" class="color-hex" id="th-text-color-hex" placeholder="#ffff00" />
        </div>
      </div>
      <div class="toggle-row">
        <label>Mix-Blend-Mode (text over images)</label>
        <label class="toggle"><input type="checkbox" id="th-blend" data-path="theme.blendMode" /><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🌅 Background Effect</h3></div>
    <div class="section-body">
      <div class="radio-group" id="bg-effect-group">
        <label class="radio-option"><input type="radio" name="bg-effect" value="solid" data-path="theme.backgroundEffect" /><span>Solid colour</span><span class="radio-desc">Simple flat colour</span></label>
        <label class="radio-option"><input type="radio" name="bg-effect" value="gradient-static" data-path="theme.backgroundEffect" /><span>Gradient (static)</span><span class="radio-desc">Two-colour linear gradient</span></label>
        <label class="radio-option"><input type="radio" name="bg-effect" value="gradient-animated" data-path="theme.backgroundEffect" /><span>Gradient (animated)</span><span class="radio-desc">Slow-panning gradient</span></label>
        <label class="radio-option"><input type="radio" name="bg-effect" value="blob-mesh" data-path="theme.backgroundEffect" /><span>Blob Mesh</span><span class="radio-desc">Floating colour blobs</span></label>
        <label class="radio-option"><input type="radio" name="bg-effect" value="noise" data-path="theme.backgroundEffect" /><span>Noise only</span><span class="radio-desc">Solid + texture grain</span></label>
      </div>
      <div id="gradient-controls" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Gradient From</label>
          <div class="color-row">
            <input type="color" id="th-grad-from" data-path="theme.backgroundGradientFrom" />
            <input type="text" class="color-hex" id="th-grad-from-hex" />
          </div>
        </div>
        <div class="field">
          <label>Gradient To</label>
          <div class="color-row">
            <input type="color" id="th-grad-to" data-path="theme.backgroundGradientTo" />
            <input type="text" class="color-hex" id="th-grad-to-hex" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🌫 Noise / Grain</h3></div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Enable noise overlay</label>
        <label class="toggle"><input type="checkbox" id="th-noise-enabled" data-path="theme.noiseGrain.enabled" /><span class="toggle-track"></span></label>
      </div>
      <div id="noise-controls" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Opacity</label>
          <div class="slider-row">
            <input type="range" id="th-noise-opacity" min="0.01" max="0.2" step="0.01" data-path="theme.noiseGrain.opacity" />
            <span class="slider-value" id="th-noise-opacity-val">0.04</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🌑 Image Shadow</h3></div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Enable image drop shadow</label>
        <label class="toggle"><input type="checkbox" id="th-shadow-enabled" data-path="theme.imageShadow.enabled" /><span class="toggle-track"></span></label>
      </div>
      <div id="shadow-controls" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Shadow Colour</label>
          <div class="color-row">
            <input type="color" id="th-shadow-color" data-path="theme.imageShadow.color" />
            <input type="text" class="color-hex" id="th-shadow-color-hex" />
          </div>
        </div>
        <div class="field">
          <label>Opacity</label>
          <div class="slider-row">
            <input type="range" id="th-shadow-opacity" min="0" max="0.4" step="0.01" data-path="theme.imageShadow.opacity" />
            <span class="slider-value" id="th-shadow-opacity-val">0.06</span>
          </div>
        </div>
        <div class="field">
          <label>Blur (px)</label>
          <div class="slider-row">
            <input type="range" id="th-shadow-blur" min="0" max="80" step="1" data-path="theme.imageShadow.blur" />
            <span class="slider-value" id="th-shadow-blur-val">30</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About theme settings</summary>
    <div class="help-content">
      <p><strong>Mix-Blend-Mode</strong>: When enabled, your text colour interacts with the images underneath it using CSS <code>mix-blend-mode: difference</code>. This creates a striking contrast effect where text appears to invert over images. Turn off for plain readability.</p>
      <p><strong>Blob Mesh</strong>: Uses CSS radial gradients with animation to create floating colour blobs. Works best with vibrant background/gradient colours.</p>
    </div>
  </details>
</template>

<!-- Typography -->
<template id="tpl-typography">
  <div class="section-card">
    <div class="section-header"><h3>Aa Font</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="typo-embed">Google Fonts Embed Code</label>
        <textarea id="typo-embed" data-path="ui.fontEmbedCode" rows="3" placeholder='&lt;link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet"&gt;'></textarea>
        <span class="hint">Copy &amp; paste the full <code>&lt;link&gt;</code> tag from <a href="https://fonts.google.com" target="_blank" rel="noopener">fonts.google.com</a>. Leave blank to use JetBrains Mono (default).</span>
      </div>
      <div class="field">
        <label>Font Preview</label>
        <div id="font-preview" style="font-size:18px; padding:12px; background: var(--bg-3); border-radius: 4px; border: 1px solid var(--border);">
          The quick brown fox jumps over the lazy dog
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>Aa Text Size</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Base Text Size</label>
        <div class="slider-row">
          <input type="range" id="typo-size" min="12" max="24" step="1" data-path="ui.textSize" />
          <span class="slider-value" id="typo-size-val">18px</span>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>✨ Text Animation</h3></div>
    <div class="section-body">
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="text-anim" value="none" data-path="theme.textAnimation" /><span>None</span><span class="radio-desc">Static colour</span></label>
        <label class="radio-option"><input type="radio" name="text-anim" value="color-cycle" data-path="theme.textAnimation" /><span>Colour Cycle</span><span class="radio-desc">Cycles through hues</span></label>
        <label class="radio-option"><input type="radio" name="text-anim" value="gradient" data-path="theme.textAnimation" /><span>Gradient</span><span class="radio-desc">Animated gradient text</span></label>
        <label class="radio-option"><input type="radio" name="text-anim" value="hue-rotate" data-path="theme.textAnimation" /><span>Hue Rotate</span><span class="radio-desc">Smooth hue rotation (Chrome)</span></label>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About typography</summary>
    <div class="help-content">
      <p>To use a custom font: go to <a href="https://fonts.google.com" target="_blank" rel="noopener">fonts.google.com</a>, select a font, click <em>Get embed code</em>, and copy the <code>&lt;link&gt;</code> tag into the embed field. The font will immediately render in the preview.</p>
      <p><strong>Hue Rotate</strong> animation uses CSS <code>@property</code> which requires Chrome/Edge. It gracefully falls back to static colour on Firefox and Safari.</p>
    </div>
  </details>
</template>

<!-- Layouts -->
<template id="tpl-layouts">
  <div class="section-card">
    <div class="section-header"><h3>⊟ Available Layouts</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Enable layouts (at least one required)</label>
        <div class="checkbox-row"><input type="checkbox" id="lay-random" data-layout="random" /><span>Random / Scatter</span></div>
        <div class="checkbox-row"><input type="checkbox" id="lay-rows"   data-layout="rows"   /><span>Rows</span></div>
        <div class="checkbox-row"><input type="checkbox" id="lay-stacks" data-layout="stacks" /><span>Stacks</span></div>
      </div>
      <div class="field">
        <label>Default Layout</label>
        <select id="lay-default" data-path="layouts.default">
          <option value="random">Random</option>
          <option value="rows">Rows</option>
          <option value="stacks">Stacks</option>
        </select>
      </div>
    </div>
  </div>
  <div class="section-card" id="lay-random-card">
    <div class="section-header"><h3>▩▩▩ Random Layout</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="lay-random-label">Button Label</label>
        <input type="text" id="lay-random-label" data-layout-label="random" placeholder="▩▩▩" />
      </div>
      <div class="field">
        <label>Scarcity (canvas size)</label>
        <div class="slider-row">
          <input type="range" id="lay-random-scarcity" min="300" max="1000" step="10" data-path="layouts.random.scarcity" />
          <span class="slider-value" id="lay-random-scarcity-val">520</span>
        </div>
        <span class="hint">Higher = more spread out. Lower = more compact cluster.</span>
      </div>
      <div class="field">
        <label>Overlap Ratio</label>
        <div class="slider-row">
          <input type="range" id="lay-random-overlap" min="0" max="0.6" step="0.05" data-path="layouts.random.overlapRatio" />
          <span class="slider-value" id="lay-random-overlap-val">0.2</span>
        </div>
        <span class="hint">0 = no overlap, 0.6 = heavy overlap.</span>
      </div>
      <div class="toggle-row">
        <label>Draggable items</label>
        <label class="toggle"><input type="checkbox" id="lay-random-drag" data-path="layouts.random.draggable" /><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
  <div class="section-card" id="lay-rows-card">
    <div class="section-header"><h3>▤▤▤ Rows Layout</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="lay-rows-label">Button Label</label>
        <input type="text" id="lay-rows-label" data-layout-label="rows" placeholder="▤▤▤" />
      </div>
      <div class="field">
        <label>Row Height (px)</label>
        <div class="slider-row">
          <input type="range" id="lay-rows-height" min="120" max="600" step="10" data-path="layouts.rows.rowHeight" />
          <span class="slider-value" id="lay-rows-height-val">280</span>
        </div>
      </div>
      <div class="field">
        <label>Gap (px)</label>
        <div class="slider-row">
          <input type="range" id="lay-rows-gap" min="0" max="80" step="4" data-path="layouts.rows.gap" />
          <span class="slider-value" id="lay-rows-gap-val">24</span>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card" id="lay-stacks-card">
    <div class="section-header"><h3>▧▧▧ Stacks Layout</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="lay-stacks-label">Button Label</label>
        <input type="text" id="lay-stacks-label" data-layout-label="stacks" placeholder="▧▧▧" />
      </div>
      <div class="field">
        <label>Stack Spacing (px)</label>
        <div class="slider-row">
          <input type="range" id="lay-stacks-spacing" min="400" max="2000" step="100" data-path="layouts.stacks.spacing" />
          <span class="slider-value" id="lay-stacks-spacing-val">1000</span>
        </div>
        <span class="hint">Distance between category stacks on the canvas.</span>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About layouts</summary>
    <div class="help-content">
      <p>You can offer one, two, or all three layout modes to visitors. The <strong>Default Layout</strong> is loaded on first visit. Visitors can switch using the layout buttons on the canvas (if visible).</p>
      <p>If only one layout is enabled, the layout switcher panel is automatically hidden.</p>
    </div>
  </details>
</template>

<!-- Categories -->
<template id="tpl-categories">
  <div class="section-card">
    <div class="section-header"><h3>⊛ Category Behaviour</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Behaviour on click</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="cat-behaviour" value="hide-on-click" data-path="categories.behaviour" /><span>Hide on click</span><span class="radio-desc">Toggle category visibility</span></label>
          <label class="radio-option"><input type="radio" name="cat-behaviour" value="focus-on-click" data-path="categories.behaviour" /><span>Focus on click</span><span class="radio-desc">Highlight one, treat others</span></label>
        </div>
      </div>
      <div id="focus-effect-group" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Non-focused items effect</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="cat-focus-effect" value="hide" data-path="categories.focusEffect" /><span>Hide</span></label>
            <label class="radio-option"><input type="radio" name="cat-focus-effect" value="blur" data-path="categories.focusEffect" /><span>Blur</span></label>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="cat-viewall-label">"View All" button label</label>
        <input type="text" id="cat-viewall-label" data-path="categories.viewAllLabel" placeholder="ALL" />
        <span class="hint">Shown in the category panel when a category is focused.</span>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About category behaviour</summary>
    <div class="help-content">
      <p><strong>Hide on click</strong>: clicking a category button hides that group of images from the canvas. Clicking again shows them.</p>
      <p><strong>Focus on click</strong>: clicking a category highlights just that group, while others are either hidden or blurred. A "View All" button restores the full canvas. This is great for presenting specific project types to different audiences.</p>
    </div>
  </details>
</template>

<!-- Image Effects -->
<template id="tpl-imageeffects">
  <div class="section-card">
    <div class="section-header"><h3>✦ Initial State</h3></div>
    <div class="section-body">
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="img-state" value="colour" data-path="imageEffects.initialState" /><span>Colour</span><span class="radio-desc">Full colour from load</span></label>
        <label class="radio-option"><input type="radio" name="img-state" value="desaturated" data-path="imageEffects.initialState" /><span>Desaturated</span><span class="radio-desc">Greyscale, colour on interaction</span></label>
        <label class="radio-option"><input type="radio" name="img-state" value="duotone" data-path="imageEffects.initialState" /><span>Duotone</span><span class="radio-desc">Two-tone colour effect</span></label>
      </div>
      <div id="duotone-controls" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Duotone Hue (0–360°)</label>
          <div class="slider-row">
            <input type="range" id="fx-duotone-hue" min="0" max="360" step="1" />
            <span class="slider-value" id="fx-duotone-hue-val">220</span>
          </div>
        </div>
        <div class="field">
          <label>Duotone Saturation (%)</label>
          <div class="slider-row">
            <input type="range" id="fx-duotone-sat" min="0" max="100" step="1" />
            <span class="slider-value" id="fx-duotone-sat-val">80</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>✦ Interactions</h3></div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Hover Reveal (hover = show colour)</label>
        <label class="toggle"><input type="checkbox" id="fx-hover-reveal" data-path="imageEffects.hoverReveal" /><span class="toggle-track"></span></label>
      </div>
      <div class="field">
        <label>Click Mode</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="fx-click-mode" value="none" data-path="imageEffects.clickMode" /><span>None</span></label>
          <label class="radio-option"><input type="radio" name="fx-click-mode" value="gallery" data-path="imageEffects.clickMode" /><span>Gallery</span><span class="radio-desc">Accumulate coloured items</span></label>
          <label class="radio-option"><input type="radio" name="fx-click-mode" value="spotlight" data-path="imageEffects.clickMode" /><span>Spotlight</span><span class="radio-desc">Only one coloured at a time</span></label>
        </div>
      </div>
      <div class="toggle-row">
        <label>Blur others on click</label>
        <label class="toggle"><input type="checkbox" id="fx-blur-others" data-path="imageEffects.blurOthersOnClick" /><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About image effects</summary>
    <div class="help-content">
      <p>Set the canvas to display all images in <strong>desaturated</strong> or <strong>duotone</strong> mode by default. Interaction (hover or click) then reveals the full colour of individual images.</p>
      <p><strong>Gallery mode</strong>: each clicked image stays coloured — building up a gallery of highlighted work.</p>
      <p><strong>Spotlight mode</strong>: only one image is coloured at a time — clicking another moves the colour to the new selection.</p>
    </div>
  </details>
</template>

<!-- Image Click -->
<template id="tpl-imageclick">
  <div class="section-card">
    <div class="section-header"><h3>↗ Lightbox</h3></div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Enable lightbox</label>
        <label class="toggle"><input type="checkbox" id="ic-lightbox-enabled" data-path="imageClick.lightbox.enabled" /><span class="toggle-track"></span></label>
      </div>
      <div id="lightbox-controls" class="sub-panel" style="display:none;">
        <div class="field">
          <label>Backdrop effect</label>
          <select id="ic-lightbox-backdrop" data-path="imageClick.lightbox.backdropEffect">
            <option value="darken">Darken</option>
            <option value="blur">Blur</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>↗ Canvas Expand</h3></div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Enable canvas expand (zoom to image)</label>
        <label class="toggle"><input type="checkbox" id="ic-expand-enabled" data-path="imageClick.canvasExpand.enabled" /><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
  <div class="section-card" id="ic-trigger-card" style="display:none;">
    <div class="section-header"><h3>↗ Trigger Mode</h3></div>
    <div class="section-body">
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="ic-trigger" value="single" /><span>Single click → Canvas Expand; double-click → Lightbox</span></label>
        <label class="radio-option"><input type="radio" name="ic-trigger" value="double" /><span>Single click → Lightbox; double-click → Canvas Expand</span></label>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About image click</summary>
    <div class="help-content">
      <p><strong>Lightbox</strong>: clicking an image opens it full-screen. Navigate with arrow keys or ← → on keyboard.</p>
      <p><strong>Canvas Expand</strong>: clicking an image smoothly zooms the canvas to frame that image in the viewport without leaving the canvas. Clicking again or pressing ESC zooms back out.</p>
      <p>When both are enabled, you choose which action maps to single-click vs double-click.</p>
    </div>
  </details>
</template>

<!-- INFO Panel -->
<template id="tpl-info">
  <div class="section-card">
    <div class="section-header"><h3>ℹ INFO Overlay</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Canvas overlay effect when INFO is open</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="info-effect" value="none" data-path="info.overlayEffect" /><span>None</span></label>
          <label class="radio-option"><input type="radio" name="info-effect" value="blur-bg" data-path="info.overlayEffect" /><span>Blur Background</span></label>
          <label class="radio-option"><input type="radio" name="info-effect" value="darken" data-path="info.overlayEffect" /><span>Darken</span></label>
          <label class="radio-option"><input type="radio" name="info-effect" value="colour-overlay" data-path="info.overlayEffect" /><span>Colour Overlay</span></label>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>ℹ Button Styles</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Open Button Style</label>
        <select id="info-btn-style" data-path="info.buttonStyle">
          <option value="arrow">Arrow (→)</option>
          <option value="icon">Icon (ℹ)</option>
          <option value="text">Text only</option>
          <option value="text-arrow">Text + Arrow</option>
        </select>
      </div>
      <div class="field">
        <label>Close Button Style</label>
        <select id="info-close-style" data-path="info.closeStyle">
          <option value="x-only">× Only</option>
          <option value="text-x">Text + ×</option>
          <option value="arrow-back">← Back</option>
        </select>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About INFO panel</summary>
    <div class="help-content">
      <p>The INFO overlay displays your about text (set in Identity) when a visitor clicks your INFO button. The canvas overlay effect adds visual context while the panel is open.</p>
      <p>Edit the INFO text content in the <strong>Identity</strong> tab.</p>
    </div>
  </details>
</template>

<!-- SEO -->
<template id="tpl-seo">
  <div class="section-card">
    <div class="section-header"><h3>🔍 Meta Tags</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="seo-desc">Meta Description</label>
        <textarea id="seo-desc" data-path="seo.metaDescription" rows="2" placeholder="Portfolio of projects, experiments and media."></textarea>
        <span class="hint">~160 characters. Shown in Google search results.</span>
      </div>
      <div class="field">
        <label>Keywords</label>
        <div class="tag-input-wrap" id="seo-keywords-wrap">
          <input type="text" class="tag-inner-input" id="seo-keywords-input" placeholder="Add keyword…" />
        </div>
        <span class="hint">Press Enter or comma to add a keyword.</span>
      </div>
      <div class="field">
        <label for="seo-canonical">Canonical URL</label>
        <input type="url" id="seo-canonical" data-path="seo.canonicalUrl" placeholder="https://example.com/" />
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🔍 Open Graph</h3></div>
    <div class="section-body">
      <div class="field">
        <label for="seo-og-image">OG Image filename</label>
        <input type="text" id="seo-og-image" data-path="seo.ogImage" placeholder="og-image.jpg" />
        <span class="hint">Place a 1200×630px image in the project root. See the Favicon tab for creation tips.</span>
      </div>
      <div class="field">
        <label for="seo-twitter">Twitter / X Handle</label>
        <input type="text" id="seo-twitter" data-path="seo.twitterHandle" placeholder="@yourhandle" />
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🔍 Schema.org</h3></div>
    <div class="section-body">
      <div class="field">
        <label>Schema Type</label>
        <select id="seo-schema-type" data-path="seo.schemaType">
          <option value="Person">Person</option>
          <option value="Organization">Organization</option>
        </select>
      </div>
      <div class="field">
        <label for="seo-job-title">Job Title</label>
        <input type="text" id="seo-job-title" data-path="seo.jobTitle" placeholder="Designer" />
      </div>
      <div class="field">
        <label>Social Profile URLs (sameAs)</label>
        <div class="url-list" id="seo-same-as-list"></div>
        <button class="btn btn-secondary btn-sm" id="seo-add-url" style="margin-top:8px;">+ Add URL</button>
      </div>
    </div>
  </div>
  <details class="help-block">
    <summary class="help-toggle">❓ About SEO</summary>
    <div class="help-content">
      <p>After editing these fields, click <strong>Rebuild Site</strong> to inject your meta tags into <code>index.html</code> and update the sitemap. Hosting platforms like Cloudflare Pages and Netlify serve the static <code>index.html</code>, so the tags need to be baked in at build time.</p>
      <p>The <strong>canonical URL</strong> tells search engines which URL is the authoritative version of your page — use your final deployed URL.</p>
    </div>
  </details>
</template>

<!-- Favicon -->
<template id="tpl-favicon">
  <div class="section-card">
    <div class="section-header"><h3>🖼 Favicon Setup</h3></div>
    <div class="section-body">
      <p style="color:var(--text-secondary); font-size:12.5px; line-height:1.7; margin-bottom:12px;">
        Use the free tool <a href="https://realfavicongenerator.net" target="_blank" rel="noopener" style="color:var(--text-accent)">realfavicongenerator.net</a> to generate all favicon sizes from a single image. Follow these steps:
      </p>
      <div class="favicon-steps">
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Prepare your logo / icon</strong>
            <p>Create a square image at least 512×512px. PNG with a transparent background works best. You can use Figma, Canva, or any image editor.</p>
          </div>
        </div>
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Generate favicon package</strong>
            <p>Go to <a href="https://realfavicongenerator.net" target="_blank" rel="noopener">realfavicongenerator.net</a>, upload your icon, configure options, and download the package.</p>
          </div>
        </div>
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Replace the favicon/ folder contents</strong>
            <p>Extract the downloaded package and copy all files into your project's <code>favicon/</code> folder, overwriting the placeholders.</p>
          </div>
        </div>
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Rebuild the site</strong>
            <p>Click <strong>Rebuild Site</strong> above — this automatically syncs your site title into <code>favicon/site.webmanifest</code>.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-header"><h3>🖼 Open Graph Image (og-image.jpg)</h3></div>
    <div class="section-body">
      <p style="color:var(--text-secondary); font-size:12.5px; line-height:1.7; margin-bottom:12px;">
        This image appears when your portfolio is shared on social media (Twitter/X, LinkedIn, iMessage, Slack, etc.).
      </p>
      <div class="favicon-steps">
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Create a 1200×630px image</strong>
            <p>Use Figma, Canva, or Photoshop. Include your name, a visual from your work, and keep text minimal. Save as JPEG for small file size.</p>
          </div>
        </div>
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Place in project root</strong>
            <p>Save it as <code>og-image.jpg</code> in the root of your project folder (same level as <code>index.html</code>).</p>
          </div>
        </div>
        <div class="favicon-step">
          <div class="favicon-step-body">
            <strong>Set the filename in SEO tab</strong>
            <p>Go to the SEO tab and enter the filename in the "OG Image filename" field, then <strong>Rebuild Site</strong>.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Help -->
<template id="tpl-help">
  <div class="help-panel">
    <h2>Getting Started</h2>
    <p>Welcome to the Canvas Portfolio Setup GUI. This tool lets you configure every aspect of your portfolio without touching any code.</p>

    <h3>Quick Start</h3>
    <ul>
      <li>Fill in your <strong>Identity</strong> (name, email, about text)</li>
      <li>Choose your <strong>Theme</strong> colours and effects</li>
      <li>Configure <strong>Layouts</strong> and <strong>Image Effects</strong></li>
      <li>Fill in your <strong>SEO</strong> details</li>
      <li>Click <strong>Save Config</strong> to write <code>config.json</code></li>
      <li>Click <strong>Rebuild Site</strong> to update SEO tags, sitemap &amp; webmanifest</li>
    </ul>

    <h3>Adding Your Images</h3>
    <p>Place your images inside <code>assets/images/</code>. Each subfolder becomes a category:</p>
    <pre>assets/images/
  work/        → "work" category
  personal/    → "personal" category
  experiments/ → "experiments" category</pre>
    <p>Supported formats: <code>.jpg</code>, <code>.jpeg</code>, <code>.png</code>, <code>.webp</code>, <code>.avif</code>, <code>.mp4</code> (video)</p>
    <p>After adding images, click <strong>Rebuild Site</strong> to scan them and update <code>data.js</code>.</p>

    <h3>Deploying to Cloudflare Pages (free)</h3>
    <ul>
      <li>Push your project to GitHub</li>
      <li>Go to <a href="https://pages.cloudflare.com" target="_blank" rel="noopener">pages.cloudflare.com</a> → Create a project → Connect GitHub repo</li>
      <li>Build command: <em>leave empty</em> (static site)</li>
      <li>Output directory: <code>/</code> (root)</li>
      <li>Click Deploy</li>
    </ul>

    <h3>Deploying to Netlify (free)</h3>
    <ul>
      <li>Go to <a href="https://netlify.com" target="_blank" rel="noopener">netlify.com</a> → Add new site → Import from Git</li>
      <li>Build command: <em>leave empty</em></li>
      <li>Publish directory: <code>.</code></li>
      <li>Click Deploy</li>
    </ul>

    <h3>Frequently Asked Questions</h3>

    <p><strong>Changes aren't showing in the preview?</strong><br />
    Click "↺ Reload Preview" in the top bar to force a refresh of the preview iframe.</p>

    <p><strong>The preview iframe shows a blank page?</strong><br />
    Make sure you started the server from the project root directory. Check the terminal for errors.</p>

    <p><strong>Rebuild shows an error about sharp?</strong><br />
    Run <code>npm install</code> inside the <code>admin/</code> folder to install dependencies.</p>

    <p><strong>Port 3000 is already in use?</strong><br />
    Stop any other server on that port, or start with: <code>PORT=3001 node admin/setup-server.js</code></p>

    <p><strong>Images aren't appearing on the canvas?</strong><br />
    Make sure you ran Rebuild after adding images. Check that image files are inside an <code>assets/images/category-name/</code> subfolder.</p>
  </div>
</template>

<script src="setup.js"></script>
</body>
</html>
